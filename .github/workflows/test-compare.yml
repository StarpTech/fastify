name: Test compare
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  run:
    if: contains(github.event.pull_request.labels.*.name, 'test-compare')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Test compare
        uses: nearform-actions/github-action-test-compare@353f079bc5232d8e7ef19e46b0debbe0ccdbf09c # v1.1.0
        with:
          label: test-compare
          testCommand: 'npm run test:ci'
